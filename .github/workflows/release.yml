name: Build Tauri release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            bundles: nsis
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: mac-arm64
            os: macos-15
            bundles: app
          - platform: mac-x64
            os: macos-15-intel
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Check release version
        run: |
          node -e 'const v=require("./package.json").version; if(process.env.RELEASE_TAG!=="v"+v || require("./src-tauri/tauri.conf.json").version!==v) process.exit(1)'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0
      - run: npm ci
      - name: Use the Windows archive tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:SystemRoot\System32"
      - name: Build Tauri application and packages
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: npm run package -- --bundles "${{ matrix.bundles }}" -- --locked
      - name: Test reporting workers
        run: npm test
      - name: Collect Windows installer and portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $build = "src-tauri/target/release"
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item "$build/bundle/nsis/ModelGauge_${version}_x64-setup.exe" artifacts
          $files = @("modelgauge.exe","modelgauge-node.exe","worker.cjs","licenses","wsl") | ForEach-Object { Join-Path $build $_ }
          Compress-Archive -Path $files -DestinationPath "artifacts/ModelGauge-$version-windows-x64-portable.zip"
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir artifacts
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
      - name: Verify and archive macOS application
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          app=src-tauri/target/release/bundle/macos/ModelGauge.app
          case "$PLATFORM" in mac-x64) arch=x86_64 ;; mac-arm64) arch=arm64 ;; esac
          lipo -verify_arch "$arch" "$app/Contents/MacOS/modelgauge"
          lipo -verify_arch "$arch" "$app/Contents/MacOS/modelgauge-node"
          test -s "$app/Contents/Resources/worker.cjs"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir artifacts
          ditto -c -k --keepParent "$app" "artifacts/ModelGauge-${RELEASE_TAG#v}-$PLATFORM.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          version=${RELEASE_TAG#v}
          files=("ModelGauge_${version}_x64-setup.exe" "ModelGauge-$version-windows-x64-portable.zip"
                 "ModelGauge_${version}_amd64.deb" "ModelGauge_${version}_amd64.AppImage"
                 "ModelGauge-$version-mac-arm64.zip" "ModelGauge-$version-mac-x64.zip")
          sha256sum "${files[@]}" > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "ModelGauge $version" --notes "Tauri builds for Windows, macOS, and Linux. SHA256SUMS.txt lists the checksum for each download."
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}" SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
