name: Build Tauri release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  wsl-runtime:
    name: Stage Linux runtime for WSL
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check release version and publication status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const v=require("./package.json").version; if(process.env.RELEASE_TAG!=="v"+v || require("./src-tauri/tauri.conf.json").version!==v) process.exit(1)'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -se --arg tag "$RELEASE_TAG" 'all(.[][]; .tag_name != $tag or .draft)'
      - run: node scripts/runtimes.mjs --wsl
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-runtime
          path: dist/wsl/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: wsl-runtime
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-2022, bundles: nsis }
          - { platform: linux-x64, os: ubuntu-22.04, bundles: 'deb,appimage' }
          - { platform: mac-arm64, os: macos-15, bundles: app }
          - { platform: mac-x64, os: macos-15-intel, bundles: app }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0
      - run: npm ci
      - name: Restore WSL runtime into the Windows bundle
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: wsl-runtime
          path: dist/wsl
      - name: Build and upload Tauri packages to the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ModelGauge ${{ env.RELEASE_TAG }}
          releaseBody: "Recovers retained Claude sessions in the 90-day usage report. Includes Tauri packages for Windows, Linux and macOS."
          releaseDraft: true
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} -- --locked
          retryAttempts: 2
      - run: npm test
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/release/bundle/macos/ModelGauge.app
          lipo "$app/Contents/MacOS/modelgauge" -verify_arch "$(uname -m)"
          lipo "$app/Contents/MacOS/modelgauge-node" -verify_arch "$(uname -m)"
          test -s "$app/Contents/Resources/worker.cjs"
          codesign --verify --deep --strict "$app"
      - name: Add the portable Windows ZIP to the draft
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $files = @("modelgauge.exe","modelgauge-node.exe","worker.cjs","licenses","wsl") | ForEach-Object { Join-Path "src-tauri/target/release" $_ }
          $zip = "ModelGauge-$version-windows-x64-portable.zip"
          Compress-Archive -Path $files -DestinationPath $zip
          gh release upload $env:RELEASE_TAG $zip --clobber

  checksums:
    name: Verify draft downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          mkdir packages && cd packages
          gh release download "$RELEASE_TAG" --pattern 'ModelGauge*'
          [[ $(find . -type f | wc -l) -eq 6 ]]
          sha256sum ModelGauge* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
